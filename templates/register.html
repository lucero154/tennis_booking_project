
{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<h2>Registro</h2>
<form method="post">
  <label>Nombre: <input name="name" required></label><br>
  <label>Apellido: <input name="surname" required></label><br>
  <label>Email: <input name="email" type="email" required></label><br>
  <label>Edad: <input name="age" type="number" min="0" required></label><br>
  <label>Domicilio: <input name="address" required></label><br>
  <button type="submit">Registrar</button>
</form>
{% endblock %}
